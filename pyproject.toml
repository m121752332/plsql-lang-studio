[project]
name = "pllangstudio"
version = "0.1.0"
description = "PL/SQL Developer 語言編輯與比對器"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencc>=1.4.2",
    "pyside6>=6.12.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]
[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
